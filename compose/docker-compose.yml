name: task-service

services:
  task-service-app:
    build:
      context: ../task-service-impl
      dockerfile: Dockerfile
    container_name: task-service-app
    depends_on:
      task-db-migrator:
        condition: service_completed_successfully
    ports:
      - "8081:8081"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://global-postgres:5432/common_db?currentSchema=us
      - SPRING_DATASOURCE_USERNAME=user_admin
      - SPRING_DATASOURCE_PASSWORD=password
      - SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_SCHEMA=us
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=global-kafka:29092
      - APP_SERVICES_USER-SERVICE_URL=http://user-service-app:8080
    networks:
      - backend-net

  task-db-migrator:
    image: task-service-db:latest
    container_name: task-service-migrator
    environment:
      - DB_URL=jdbc:postgresql://global-postgres:5432/common_db
      - DB_SCHEMA=us
      - DB_LOGIN=user_admin
      - DB_PASSWORD=password
      - CHANGELOG_FILE=db/changelog/db.changelog-master.xml
    networks:
      - backend-net

networks:
  backend-net:
    external: true