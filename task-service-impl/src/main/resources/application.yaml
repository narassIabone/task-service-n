server:
  port: 8081

app:
  scheduler:
    cron: "0 * * * * *" # Раз в минуту
    batch-size: 5
  security:
    technical-token: ${APP_SECURITY_TECHNICAL_TOKEN}
  services:
    user-service:
      url: "http://localhost:8080"

spring:
  application:
    name: task-service
  kafka:
    bootstrap-servers: localhost:9092
    topic-name: "notification.message.in"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

  datasource:
    url: jdbc:postgresql://localhost:5432/common_db?currentSchema=ts
    username: user_admin
    password: password
    driver-class-name: org.postgresql.Driver
    jpa:
      hibernate:
        format_sql: true
        highlight_sql: true

